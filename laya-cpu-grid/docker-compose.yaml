services:
  # CORE ENGINE
  laya-core:
    build:
      context: ..
      dockerfile: laya-cpu-grid/Dockerfile.cpu
    image: laya-inference-engine
    container_name: laya-inference-engine
    # CORREZIONE: Forza l'esecuzione come root per permettere la scrittura sul volume laya_cache
    user: root
    command: laya-serve
    environment:
      - LAYA_DEVICE=cpu
      - LAYA_THREADS=4
      - LAYA_PRELOAD=1
      - HF_HUB_CACHE=/data/huggingface
    volumes:
      - laya_cache:/data/huggingface
    ports:
      - "8000:8000"
    networks:
      - unsloth-net
    restart: unless-stopped

  # MCP BRIDGE
  laya-mcp-bridge:
    image: laya-inference-engine
    container_name: laya-mcp-bridge
    depends_on:
      - laya-core
    environment:
      - LAYA_HOST=laya-core
      - LAYA_PORT=8000
      - LAYA_MCP_LISTEN=0.0.0.0
      - LAYA_MCP_PORT=8001
    command: laya-mcp-server
    ports:
      - "8001:8001"
    networks:
      - unsloth-net
    restart: unless-stopped

networks:
  unsloth-net:
    external: true

volumes:
  laya_cache:
