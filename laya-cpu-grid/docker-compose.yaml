services:
  # CORE ENGINE
  laya-core:
    build:
      context: ..
      dockerfile: laya-cpu-grid/Dockerfile.cpu
    image: laya-inference-engine
    container_name: laya-inference-engine
    user: root
    command: >
      /bin/sh -c "chown -R layauser:layauser /data/huggingface && 
      exec su layauser -c 'laya-serve'"
    environment:
      - LAYA_DEVICE=${LAYA_DEVICE:-cpu}
      - LAYA_THREADS=${LAYA_THREADS:-4}
      - LAYA_PRELOAD=${LAYA_PRELOAD:-1}
      - LAYA_MODEL_ID=${LAYA_MODEL_ID:-convaiinnovations/laya}
      - HF_HUB_CACHE=/data/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - laya_cache:/data/huggingface
    ports:
      - "8000:8000"
    networks:
      - unsloth-net
    restart: unless-stopped

  # MCP BRIDGE (Updated with correct internal path)
  laya-mcp-bridge:
    image: laya-inference-engine
    container_name: laya-mcp-bridge
    user: layauser
    depends_on:
      - laya-core
    environment:
      - LAYA_HOST=laya-core
      - LAYA_PORT=8000
      - LAYA_MCP_LISTEN=${LAYA_MCP_LISTEN:-0.0.0.0}
      - LAYA_MCP_PORT=${LAYA_MCP_PORT:-8001}
    # FIXED: Path updated to reflect the directory structure inside the container
    command: python /app/docker/laya_mcp_sse_bridge.py
    ports:
      - "${LAYA_MCP_PORT:-8001}:${LAYA_MCP_PORT:-8001}"
    networks:
      - unsloth-net
    restart: unless-stopped

networks:
  unsloth-net:
    external: true

volumes:
  laya_cache:
