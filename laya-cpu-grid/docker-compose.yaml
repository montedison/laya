services:
  laya-core:
    build:
      context: ..                # Punta alla root del repository (laya/)
      dockerfile: laya-cpu-grid/Dockerfile.cpu
    image: laya-inference-engine # Nome esplicito per permettere il riuso
    container_name: laya-inference-engine
    restart: unless-stopped
    environment:
      - LAYA_DEVICE=cpu
      - LAYA_THREADS=4
      - LAYA_PRELOAD=1
      - HF_HUB_CACHE=/data/huggingface
    volumes:
      - laya_cache:/data/huggingface
    ports:
      - "8000:8000"

  # Il Bridge di Comunicazione (IO-Heavy)
  laya-mcp-bridge:
    image: laya-inference-engine # Usa l'immagine costruita sopra
    container_name: laya-mcp-bridge
    depends_on:
      - laya-core
    environment:
      - LAYA_HOST=laya-core
      - LAYA_PORT=8000
      - LAYA_MCP_LISTEN=0.0.0.0
      - LAYA_MCP_PORT=8001
    command: ["laya-mcp-server"]
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  laya_cache:
